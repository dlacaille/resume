name: Release LaTeX document

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: 🏃‍♂️‍➡️ Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Generate version from date and time
        id: tag
        run: |
          TAG_NAME=$(TZ="America/Montreal" date +'%Y.%m.%d-%H.%M')
          echo "🏷️ Using version: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: 📝 Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: dominic-lacaille-cv-??.tex
          latexmk_use_lualatex: true
          
      - name: 📅 Add date to PDF file names
        id: date
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          for pdf in dominic-lacaille-cv-*.pdf; do
            new="${pdf%.pdf}-$DATE.pdf"
            mv "$pdf" "$new"
            echo "📄 Renamed $pdf → $new"
          done

      - name: 🎒 Install Poppler (for PDF screenshots)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: 📷 Generate PNG screenshot of first page
        run: |
          for pdf in dominic-lacaille-cv-*.pdf; do
            output="screenshot-${pdf%.pdf}.png"
            pdftoppm -png -f 1 -singlefile "$pdf" "${output%.png}"
            echo "📷 Generated screenshot: $output"
          done

      - name: 📋 Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-preview-pdfs
          path: dominic-lacaille-cv-*.pdf

      - name: 🚚 Create release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dominic-lacaille-cv-*.pdf
            screenshot-dominic-lacaille-cv-*.png
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📖 Update README with release date
        run: |
          DATE=${{ steps.date.outputs.date }}
          sed -i -E "s/(dominic-lacaille-cv-(en|fr))(-[0-9]{4}-[0-9]{2}-[0-9]{2})?\.pdf/\1-$DATE.pdf/g" README.mduses: stefanzweifel/git-auto-commit-action@v7
          
      - name: 🎀 Update README with release date
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update CV date to ${{ steps.date.outputs.date }}"
          file_pattern: README.md
